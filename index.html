<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SELLORA PRO</title>

<style>
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:#f5f500;
  color:#fff;
  text-align:center;
}

.hero{
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

h1{
  font-size:60px;
  color:#fff;
}

.tagline{
  font-size:20px;
}

button{
  padding:15px 28px;
  border:none;
  border-radius:30px;
  margin:10px;
  cursor:pointer;
  font-weight:bold;
}

.yellow{
  background:#000;
  color:#fff;
}

.back{
  background:#111;
  color:#fff;
}

.box{
  display:none;
  padding:30px;
}

input{
  display:block;
  margin:12px auto;
  padding:12px;
  width:250px;
  border-radius:12px;
  border:none;
  background:#000;
  color:#fff;
}

.card{
  background:#000;
  padding:30px;
  margin:25px auto;
  border-radius:20px;
  max-width:850px;
  line-height:2;
  text-align:left;
  font-size:16px;
}

.card h3{
  margin-bottom:10px;
}

.error{
  color:red;
}
</style>
</head>

<body>

<div class="hero" id="home">
  <h1>SELLORA</h1>
  <p class="tagline">Monetize Your Audience and Make Money 💰</p>
  <button class="yellow" onclick="openLogin()">Login to Sellora</button>
</div>

<div class="box" id="loginBox">
  <button class="back" onclick="goHome()">⬅ Back</button>
  <h2>Enter Details</h2>

  <input id="name" placeholder="Name">
  <input id="email" placeholder="Email">
  <input id="channel" placeholder="Channel Name (optional)">
  <input id="password" placeholder="Password (optional)">

  <p class="error" id="error"></p>
  <button class="yellow" onclick="login()">Login</button>
</div>

<div class="box" id="successBox">
  <button class="back" onclick="goHome()">⬅ Back</button>
  <h2>Welcome to Sellora</h2>
  <button class="yellow" onclick="showCategory()">Continue</button>
</div>

<div class="box" id="categoryBox">
  <button class="back" onclick="goHome()">⬅ Back</button>
  <h2>Select Your Path</h2>

  <button onclick="selectCategory('Business')">Business</button>
  <button onclick="selectCategory('Marketing')">Marketing</button>
  <button onclick="selectCategory('Investing')">Investing</button>
  <button onclick="selectCategory('Content Creating')">Content Creating</button>
</div>

<div class="box" id="resultBox">
  <button class="back" onclick="backToCategory()">⬅ Back</button>
  <h2 id="catTitle"></h2>
  <div class="card" id="catText"></div>
</div>

<script>

function hideAll(){
  document.querySelectorAll('.box').forEach(el => el.style.display='none');
  home.style.display='none';
}

function openLogin(){
  hideAll();
  loginBox.style.display='block';
}

function goHome(){
  hideAll();
  home.style.display='flex';
}

function showCategory(){
  hideAll();
  categoryBox.style.display='block';
}

function backToCategory(){
  hideAll();
  categoryBox.style.display='block';
}

function login(){
  let name = document.getElementById("name").value.trim();
  let email = document.getElementById("email").value.trim();

  if(name==="" || email===""){
    document.getElementById("error").innerText = "Please enter Name and Email!";
    return;
  }

  document.getElementById("error").innerText = "";
  hideAll();
  successBox.style.display='block';
}

function selectCategory(cat){
  hideAll();
  resultBox.style.display='block';
  catTitle.innerHTML = "🔥 " + cat + " Mastery System";

  let text = "";

  if(cat==="Business"){
    text = `
    <h3>Business System</h3>
    <p>Business is the art of identifying real-world problems and transforming them into profitable solutions. A successful business always begins with understanding what people truly need or struggle with. Once you identify a clear problem, the next step is to create a simple, effective solution in the form of a product, service, or digital offer. After that, validation becomes important — you must confirm that people are willing to pay for your solution. Branding plays a major role in business growth, as it builds trust and recognition. You then use platforms like social media, websites, and marketing systems to attract customers and generate revenue. Over time, by improving your offer, building systems, and scaling operations, your business evolves into a powerful machine that consistently produces income and long-term financial freedom.</p>
    `;
  }

  else if(cat==="Marketing"){
    text = `
    <h3>Complete Marketing and Website System</h3>
    <p>Marketing is the backbone of making money online, and it connects content, audience, and income into one powerful system. One of the most important parts of modern marketing is understanding how to build your own website and control your platform.</p>

    <p><b>Step 1:</b> Start by opening a code editor such as Visual Studio Code or any simple editor available on your device.  
    <b>Step 2:</b> Create a new file and name it <b>index.html</b>, which will act as the main structure of your website.  
    <b>Step 3:</b> Write the basic HTML structure including the head and body sections to define your page.  
    <b>Step 4:</b> Design your layout by creating sections like home page, login page, content area, and category sections.  
    <b>Step 5:</b> Use CSS to style your website — apply colors (like yellow and black), spacing, fonts, and button styles to make it look professional.  
    <b>Step 6:</b> Add JavaScript to make your website interactive, such as handling login buttons, navigation between pages, and displaying dynamic content.  
    <b>Step 7:</b> Test your website in a browser, identify errors, and fix bugs until everything works smoothly.  
    <b>Step 8:</b> Improve your design, make it more attractive, faster, and user-friendly over time.</p>

    <p>Once your website is ready, marketing becomes a flow system where you create content on platforms like YouTube or social media, attract an audience, and then direct them to your website. On your website, you convert visitors into customers by offering value, products, or services. This entire system — content to audience to website to income — is how real online businesses generate money consistently. Mastering this process gives you full control over your earning potential.</p>
    `;
  }

  else if(cat==="Content Creating"){
    text = `
    <h3>Content Creation System</h3>
    <p>Content creation is one of the most powerful ways to build an audience and generate income online. It starts with selecting a niche that you are interested in and that people want to watch. Consistency is key — posting regularly helps you grow faster. High-quality content with strong hooks at the beginning captures attention, while good storytelling keeps viewers engaged. Learning editing, improving visuals, and understanding audience behavior are important steps in becoming a successful creator. Over time, as your audience grows, you can monetize through advertisements, sponsorships, brand deals, and selling your own products or services. A successful content creator is someone who keeps learning, improving, and adapting to trends while staying consistent.</p>
    `;
  }

  else{
    text = `
    <h3>Investing System</h3>
    <p>Investing is the process of growing your money over time by putting it into assets such as stocks, cryptocurrencies, or other financial instruments. The key to successful investing is patience and long-term thinking. You start by learning the basics, understanding risks, and investing small amounts initially. Instead of trying to get rich quickly, focus on steady growth and reinvest your profits. Avoid emotional decisions and always make calculated moves based on knowledge and research. Over time, investing can help you build wealth and achieve financial independence.</p>
    `;
  }

  document.getElementById("catText").innerHTML = text;
}

</script>

</body>
</html>
