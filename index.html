    <!DOCTYPE html>
<html lang="en">
<head>

<meta name="google-site-verification" content="FR5SlhzT_UDNLhgFwmTQoHzzxTlwkpia5mPXZsWm300" />

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SELLORA</title>

<style>
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:#f5f500;
  color:#fff;
  text-align:center;
}

.hero{
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

h1{
  font-size:60px;
}

.tagline{
  font-size:20px;
}

button{
  padding:15px 28px;
  border:none;
  border-radius:30px;
  margin:10px;
  cursor:pointer;
  font-weight:bold;
}

.yellow{
  background:#000;
  color:#fff;
}

.back{
  background:#111;
  color:#fff;
}

.box{
  display:none;
  padding:30px;
}

input{
  display:block;
  margin:12px auto;
  padding:12px;
  width:250px;
  border-radius:12px;
  border:none;
  background:#000;
  color:#fff;
}

.card{
  background:#000;
  padding:30px;
  margin:25px auto;
  border-radius:20px;
  max-width:850px;
  line-height:2;
  text-align:left;
  font-size:15px;
}

.error{
  color:red;
}
</style>
</head>

<body>

<div class="hero" id="home">
  <h1>SELLORA</h1>
  <p class="tagline">Monetize Your Audience 💰</p>
  <button class="yellow" onclick="openLogin()">Login</button>
</div>

<div class="box" id="loginBox">
  <button class="back" onclick="goHome()">⬅ Back</button>
  <h2>Enter Details</h2>

  <input id="name" placeholder="Name">
  <input id="email" placeholder="Email">

  <p class="error" id="error"></p>
  <button class="yellow" onclick="login()">Continue</button>
</div>

<div class="box" id="categoryBox">
  <button class="back" onclick="goHome()">⬅ Back</button>
  <h2>Select</h2>

  <button onclick="selectCategory('Business')">Business</button>
  <button onclick="selectCategory('Marketing')">Marketing</button>
  <button onclick="selectCategory('Startup')">Startup Guide</button>
</div>

<div class="box" id="resultBox">
  <button class="back" onclick="backToCategory()">⬅ Back</button>
  <h2 id="catTitle"></h2>
  <div class="card" id="catText"></div>
</div>

<script>

function hideAll(){
  document.getElementById("home").style.display="none";
  document.getElementById("loginBox").style.display="none";
  document.getElementById("categoryBox").style.display="none";
  document.getElementById("resultBox").style.display="none";
}

function openLogin(){
  hideAll();
  loginBox.style.display='block';
}

function goHome(){
  hideAll();
  home.style.display='flex';
}

function login(){
  let name = document.getElementById("name").value.trim();
  let email = document.getElementById("email").value.trim();

  if(name==="" || email===""){
    document.getElementById("error").innerText = "Enter details";
    return;
  }

  document.getElementById("error").innerText = "";
  hideAll();
  categoryBox.style.display='block';
}

function backToCategory(){
  hideAll();
  categoryBox.style.display='block';
}

function selectCategory(cat){
  hideAll();
  resultBox.style.display='block';
  catTitle.innerHTML = cat;

  let text="";

  if(cat==="Business"){
    text = `<p>
Starting a business is a journey that requires vision, patience, and consistent effort. The first step is identifying a real problem that people face in their daily lives. A successful business always focuses on solving a meaningful problem. Once you identify the problem, you need to think about how you can provide a solution in a simple and effective way.

After identifying the idea, planning becomes important. You should decide your target audience, pricing strategy, and how you will deliver your product or service. At the early stage, do not try to build something perfect. Focus on creating a simple version that works.

Hiring employees is another major step. In the beginning, you can start alone or with a small team. As your business grows, you can hire people through platforms like LinkedIn, referrals, or job portals. Always hire people who are passionate and ready to learn.

Marketing plays a key role in growing your business. Use social media, websites, and content to reach people. Consistency is the most important factor in business success. Keep improving your product, listen to feedback, and stay focused on long-term growth.
</p>`;
  }

  else if(cat==="Marketing"){
    text = `<p>
Marketing is the process of attracting and engaging your audience. It is not just about selling but about building trust. In today’s world, digital marketing is the most powerful tool. Social media platforms allow you to reach millions of people.

Content marketing is very effective. By creating useful content, you can attract an audience that trusts you. SEO helps your website rank higher on search engines. Use proper keywords and valuable content.

Trading is also a part of financial growth. It involves buying and selling assets like stocks or crypto. Beginners should focus on learning before investing money. Understand risk management and never invest blindly.

Consistency and learning are key. Marketing is a long-term process. Focus on providing value and building relationships with your audience.
</p>`;
  }

  else{
    text = `<p>
Starting a startup requires courage and clarity. First, identify a problem worth solving. Do not copy others blindly. Focus on creating value.

To build a website, you need to learn HTML, CSS, and JavaScript. These are basic tools for web development. GitHub is a platform where you can store your code and publish your website.

Steps to create a website using GitHub:
1. Create an account on GitHub
2. Create a new repository
3. Upload your code files
4. Enable GitHub Pages
5. Your website will be live online

Keep improving your skills and learning new technologies. A startup grows through continuous effort and learning. Stay consistent and never give up.
</p>`;
  }

  document.getElementById("catText").innerHTML = text;
}

</script>

</body>
</html>
