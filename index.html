    <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sellora Premium+</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  font-family:'Inter',sans-serif;
  background:#0b0b0b;
  color:#fff;
}

/* NAV */
nav{
  display:flex;
  justify-content:space-between;
  padding:20px 40px;
  position:fixed;
  width:100%;
  backdrop-filter:blur(10px);
  background:rgba(0,0,0,0.4);
}

.logo{
  font-weight:700;
  letter-spacing:1px;
}

/* HERO */
.hero{
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  animation:fadeIn 1s ease;
}

.hero h1{
  font-size:64px;
  margin:0;
}

.hero p{
  color:#aaa;
  margin-top:10px;
}

/* BUTTON */
.btn{
  margin-top:30px;
  padding:14px 28px;
  border-radius:30px;
  border:1px solid #fff;
  background:transparent;
  color:#fff;
  cursor:pointer;
  transition:0.3s;
}

.btn:hover{
  background:#fff;
  color:#000;
  box-shadow:0 0 20px rgba(255,255,255,0.4);
  transform:scale(1.05);
}

/* MODAL */
.modal{
  display:none;
  position:fixed;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.7);
  backdrop-filter:blur(10px);
  animation:fadeIn 0.3s;
}

.box{
  width:340px;
  margin:10% auto;
  padding:30px;
  border-radius:16px;
  background:#111;
  border:1px solid #222;
  text-align:center;
  animation:scaleUp 0.4s ease;
}

input{
  width:100%;
  padding:12px;
  margin:10px 0;
  border-radius:8px;
  border:1px solid #333;
  background:#000;
  color:#fff;
}

/* CATEGORY */
.category button{
  margin:5px;
  padding:10px 18px;
  border-radius:20px;
  border:1px solid #444;
  background:transparent;
  color:#fff;
  cursor:pointer;
  transition:0.3s;
}

.category button:hover{
  background:#fff;
  color:#000;
}

/* DASHBOARD */
.dashboard{
  display:none;
  padding:80px 20px;
  max-width:1000px;
  margin:auto;
  animation:fadeIn 1s ease;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
}

.card{
  background:#111;
  padding:20px;
  border-radius:12px;
  border:1px solid #222;
  transition:0.3s;
}

.card:hover{
  transform:translateY(-5px);
  border-color:#555;
}

/* ANIMATIONS */
@keyframes fadeIn{
  from{opacity:0;}
  to{opacity:1;}
}

@keyframes scaleUp{
  from{transform:scale(0.9); opacity:0;}
  to{transform:scale(1); opacity:1;}
}

</style>
</head>

<body>

<nav>
  <div class="logo">SELLORA</div>
</nav>

<section class="hero">
  <h1>Sellora</h1>
  <p>Build. Monetize. Scale.</p>
  <button class="btn" onclick="openModal()">Login to Sellora</button>
</section>

<!-- MODAL -->
<div class="modal" id="modal" onclick="outsideClick(event)">

  <div class="box" id="step1">
    <h3>Create Account</h3>
    <input placeholder="Name">
    <input placeholder="Email">
    <button class="btn" onclick="next(1)">Continue</button>
  </div>

  <div class="box" id="step2" style="display:none;">
    <h3>Login</h3>
    <button class="btn" onclick="next(2)">Login</button>
  </div>

  <div class="box" id="step3" style="display:none;">
    <h3>Welcome</h3>
    <button class="btn" onclick="next(3)">Enter</button>
  </div>

  <div class="box" id="step4" style="display:none;">
    <h3>Select Category</h3>
    <div class="category">
      <button onclick="enter('Business')">Business</button>
      <button onclick="enter('Marketing')">Marketing</button>
      <button onclick="enter('Investing')">Investing</button>
    </div>
  </div>

</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dash">

  <h1 id="title"></h1>

  <div class="grid">

    <div class="card">
      <p id="text"></p>
    </div>

    <div class="card">
      <h3>Profile</h3>
      <p>Founder: You</p>
      <p>Platform: Sellora</p>
    </div>

    <div class="card">
      <h3>Stats</h3>
      <p>Growth: 🚀 Fast</p>
      <p>Level: Premium</p>
    </div>

  </div>

</div>

<script>

function openModal(){
  modal.style.display="block";
}

function next(step){
  document.getElementById("step"+step).style.display="none";
  document.getElementById("step"+(step+1)).style.display="block";
}

function enter(cat){
  modal.style.display="none";
  dash.style.display="block";

  title.innerText = cat;

  text.innerText =
  "Welcome to Sellora "+cat+" system. This is your premium dashboard where strategy meets execution. Grow faster, build smarter, and monetize efficiently.";
}

// CLOSE ON OUTSIDE CLICK
function outsideClick(e){
  if(e.target.id === "modal"){
    modal.style.display="none";
  }
}

</script>

</body>
</html>
